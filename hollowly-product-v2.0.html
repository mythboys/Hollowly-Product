ess(.9)}50%{transform:scale(1.08);filter:brightness(1.14)}}@keyframes glow{0%,100%{box-shadow:0 0 0 1px #f5c77e38,0 0 22px #f5c77e14}50%{box-shadow:0 0 0 1px #f5c77e70,0 0 38px #f5c77e2e}}@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-25px)}}@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes receipt{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}@keyframes toast{from{opacity:0;transform:translate(-50%,15px)}to{opacity:1;transform:translate(-50%,0)}}.scroll::-webkit-scrollbar{display:none}

<script>
const{createApp,ref,computed,onMounted,onBeforeUnmount}=Vue;
const guides=['今晚的风很轻，想说点什么吗？','没有人认识你，除了树洞。','把心事放下，再好好睡一觉。','这里没有对错，只有倾听。','如果今天很难，可以先从这里说起。'];
const placeholders=['说点什么吧，树洞在听…','不用组织语言，想到哪写到哪','把今晚的心事，轻轻放在这里','你可以从一句叹气开始','说出来，就已经轻了一半'];
const topics=['#微光','#叹气','#小确幸','#失眠'];
const generic=['你已经走了很远。今晚，先歇一歇。','没说出口的话，也值得被好好接住。','不用马上变好。慢一点，也没关系。','按自己的节奏来。你会重新找到光。','今天辛苦了。剩下的，交给夜风。','你不是一个人。此刻，树洞在听。','小小的勇气，也能照亮一段路。','先照顾好自己。世界可以等一等。'];
const night=['夜深了。世界安静下来，树洞还亮着。','凌晨的心事最诚实。树洞会替你收好。','先睡吧。想不通的事，明天再想。'];
const rules=[[/失眠|睡不着|熬夜|凌晨|睡不好/,['睡不着的夜晚很长，但你不是醒着的唯一一个人。','别责怪还醒着的自己，先陪它坐一会儿。']],[/工作|加班|老板|同事|裁员|离职|面试|上班|绩效/,['工作之外，你首先是你自己。','辛苦了，今晚把工作服叠好，把情绪晾一晾。']],[/分手|失恋|恋爱|前任|暗恋|告白|吵架|离婚/,['先把自己抱紧一点，才腾得出心去接新的温柔。','为一个人难过不丢人，说明你的心还认真活着。']],[/孤独|孤单|一个人|没人懂|寂寞|没朋友/,['孤独不是缺陷，是你渴望被看见。','此刻的树洞在，往后的很多个夜晚也会在。']],[/焦虑|紧张|不安|害怕|担心|压力|内耗|迷茫/,['焦虑是未来的风吹进了现在，先回到这口气里。','允许自己暂时找不到答案，树洞不催你。']],[/难过|伤心|哭|委屈|失落|崩溃|痛苦/,['眼泪不是输，是心里的雨有了去处。','允许自己难过一晚，天亮了再慢慢收拾。']],[/累|疲惫|撑不住|没力气|好难/,['累了就先不撑了，树洞帮你托一会儿。','你不需要永远有力量，歇着也是前进。']]];

function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function uid(){return'h_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function fmt(t){const d=new Date(t),w=['日','一','二','三','四','五','六'];return`${d.getMonth()+1}月${d.getDate()}日 · 星期${w[d.getDay()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function age(t){let x=Date.now()-t;return x<36e5?'刚刚':x<864e5?Math.floor(x/36e5)+' 小时前':'深夜'}function old(t){return Date.now()-t>365*86400000}
createApp({setup(){
const entered=ref(!!localStorage.getItem('hollowly_entered')),ritual=ref(!entered.value),tab=ref('listen'),guide=ref(guides[Math.floor(Math.random()*guides.length)]),content=ref(''),mood=ref(''),visibility=ref('private'),receipt=ref(null),sending=ref(false),toast=ref(''),showDelete=ref(null),settings=ref(false),clearAsk=ref(false),audio=ref(localStorage.getItem('hollowly_audio')!=='off'),p=ref(0),limit=ref(8),filter=ref('全部'),newTopic=ref(''),topicOpen=ref(false),entries=ref(read('hollowly_entries',[])),hugs=ref(read('hollowly_hugs',{})),custom=ref(read('hollowly_topics',[]));
let timer;
const allTopics=computed(()=>[...new Set(topics.concat(custom.value))]);const privateList=computed(()=>entries.value.filter(e=>e.visibility==='private'&&!old(e.createdAt)).sort((a,b)=>b.createdAt-a.createdAt));const publicAll=computed(()=>entries.value.filter(e=>e.visibility==='public'&&!e.crisis&&!old(e.createdAt)).sort((a,b)=>b.createdAt-a.createdAt));const squareTopics=computed(()=>['全部',...new Set(publicAll.value.map(e=>e.mood).filter(Boolean))]);const publicList=computed(()=>publicAll.value.filter(e=>filter.value==='全部'||e.mood===filter.value).slice(0,limit.value));const stats=computed(()=>({total:entries.value.length,private:entries.value.filter(e=>e.visibility==='private').length,public:entries.value.filter(e=>e.visibility==='public').length}));
function save(){localStorage.setItem('hollowly_entries',JSON.stringify(entries.value));localStorage.setItem('hollowly_hugs',JSON.stringify(hugs.value));localStorage.setItem('hollowly_topics',JSON.stringify(custom.value))}function note(s){toast.value=s;setTimeout(()=>toast.value='',2400)}function enter(){entered.value=true;ritual.value=false;localStorage.setItem('hollowly_entered','1');if(audio.value)sound()}function go(x){tab.value=x;receipt.value=null;if(x!=='public')filter.value='全部';scrollTo({top:0,behavior:'smooth'})}function rotate(){p.value=(p.value+1)%placeholders.length}
function reply(text,cr){let pool=cr?crisisPool.slice():generic.slice();if(!cr){for(const[r,a]of rules)if(r.test(text)){pool=a.concat(generic);break}}const h=new Date().getHours();if(h>=23||h<5)pool=pool.concat(night);let seen=read('hollowly_seen_replies',[]),fresh=pool.filter(x=>!seen.includes(x));let q=(fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length?fresh:pool).length)];localStorage.setItem('hollowly_seen_replies',JSON.stringify(seen.concat(q).slice(-14)));return q}
function blocked(t){return/(诈骗|赌博|色情|毒品|炸弹|买卖账号)/i.test(t)}function crisis(t){return/(自杀|自伤|伤害自己|不想活|活不下去|结束生命|割腕|轻生)/i.test(t)}
function addTopic(){let n=newTopic.value.trim().replace(/^#+/,'');if(!n)return;if(n.length>8){note('话题最多 8 个字哦');return}if(blocked(n)){note('这个话题不太合适，换一个试试');return}let t='#'+n;if(!allTopics.value.includes(t))custom.value.push(t);mood.value=t;newTopic.value='';topicOpen.value=false;save();note('新话题已创建：'+t)}
function submit(){let text=content.value.trim();if(text.length<10)return note('再多说一点点，至少 10 个字哦');if(text.length>500)return note('心事最多 500 字');if(blocked(text))return note('这段内容暂时无法投递，请换一种表达');let cr=crisis(text),e={id:uid(),content:text,mood:mood.value,visibility:cr?'private':visibility.value,createdAt:Date.now(),crisis:cr,hugs:0};entries.value.unshift(e);save();content.value='';mood.value='';visibility.value='private';sending.value=true;setTimeout(()=>{receipt.value={quote:reply(text,cr),crisis:cr};sending.value=false},1200)}
function hug(id){if(hugs.value[id])return;hugs.value[id]=1;let e=entries.value.find(x=>x.id===id);if(e)e.hugs=(e.hugs||0)+1;save();navigator.vibrate?.(18);note('抱抱已送达，温柔会留下来')}function remove(id){entries.value=entries.value.filter(e=>e.id!==id);save();showDelete.value=null;note('这段记忆已经随风散去了')}function clearAll(){localStorage.removeItem('hollowly_entries');localStorage.removeItem('hollowly_hugs');entries.value=[];hugs.value={};clearAsk.value=false;settings.value=false;go('listen');note('所有心事都已随风散去')}
let audioPlayer=null;function sound(){try{if(!audioPlayer){audioPlayer=new Audio('./audio/hollowly_bgm_loop.mp3');audioPlayer.loop=true;audioPlayer.preload='auto';audioPlayer.volume=.28}audioPlayer.volume=.28;const p=audioPlayer.play();if(p&&p.catch)p.catch(()=>note('请把 MP3 放入 audio 文件夹后再播放'))}catch(e){note('音频暂不可用')}}function stopSound(){if(audioPlayer){audioPlayer.pause();audioPlayer.currentTime=0}}function toggleAudio(){audio.value=!audio.value;localStorage.setItem('hollowly_audio',audio.value?'on':'off');if(audio.value)sound();else{stopSound();note('氛围声已静音')}}let speaking=false;function warmRead(text){if(!('speechSynthesis' in window)){note('当前浏览器不支持动态朗读');return}speechSynthesis.cancel();const parts=text.replace(/[，、]/g,'。').split(/[。！？!?]+/).map(x=>x.trim()).filter(Boolean);if(!parts.length)return;const voices=speechSynthesis.getVoices();const voice=voices.find(x=>x.lang==='zh-CN'&&/female|女|婷|Yaoyao|Xiaoxiao|Huihui/i.test(x.name))||voices.find(x=>x.lang==='zh-CN'||x.lang==='zh_CN');let i=0;speaking=true;const next=()=>{if(!speaking||i>=parts.length){speaking=false;if(audioPlayer)audioPlayer.volume=.28;return}const u=new SpeechSynthesisUtterance(parts[i++]);u.lang='zh-CN';u.rate=.72;u.pitch=1.06;u.volume=.86;if(voice)u.voice=voice;u.onstart=()=>{if(i===1){if(audioPlayer)audioPlayer.volume=.07;note('正在用温柔女声朗读这条回复')}};u.onend=()=>setTimeout(next,420);u.onerror=()=>{speaking=false;if(audioPlayer)audioPlayer.volume=.28};speechSynthesis.speak(u)};next()}function stopReading(){speaking=false;if('speechSynthesis' in window)speechSynthesis.cancel();if(audioPlayer)audioPlayer.volume=.28}function clearExpired(){entries.value=entries.value.filter(e=>!old(e.createdAt)||e.visibility==='private');save()}
onMounted(()=>{timer=setInterval(rotate,4200);clearExpired()});onBeforeUnmount(()=>clearInterval(timer));
return{ritual,entered,tab,guide,content,mood,visibility,receipt,sending,toast,showDelete,settings,clearAsk,audio,allTopics,privateList,publicList,squareTopics,stats,filter,limit,newTopic,topicOpen,placeholder:computed(()=>placeholders[p.value]),enter,skip:enter,go,submit,hug,remove,clearAll,addTopic,toggleAudio,warmRead,fmt,age,note};},template:`
<div class="app"><div v-if="ritual" class="fixed inset-0 z-50 flex flex-col items-center justify-center px-8 text-center" style="background:linear-gradient(150deg,#0b1021,#1b1538)"><div class="relative flex flex-col items-center fade"><div class="orb relative mb-9"></div><p class="text-xs tracking-[.38em] text-amber/70 mb-5">HOLLOWLY · V2.0</p><h1 class="text-[26px] font-medium tracking-[.13em] mb-4">{{guide}}</h1><p class="text-sm text-white/45 leading-7">跟随光，慢慢呼吸三次。<br>不必解释，也不必马上变好。</p><button @click="enter" class="mt-12 rounded-full px-8 py-3.5 text-sm text-[#24182b] bg-[#f5c77e]">轻触进入树洞 ↗</button><button @click="skip" class="mt-5 text-xs text-white/35">跳过入场仪式</button></div></div>
<main v-else class="relative mx-auto w-full max-w-[520px] min-h-dvh safe px-5 pt-8"><header class="flex items-center justify-between mb-9"><div><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber shadow-[0_0_12px_#f5c77e]"></span><span class="tracking-[.28em] text-[11px] text-white/65">HOLLOWLY</span></div><p class="text-[11px] text-white/35 mt-2">每个树洞，都装得下心事。</p></div><div class="flex gap-2"><button @click="settings=true" class="glass rounded-full w-10 h-10">⚙</button><button @click="toggleAudio" class="glass rounded-full w-10 h-10">{{audio?'♩':'♩̸'}}</button></div></header>
<section v-if="tab==='listen'" class="fade"><p class="text-sm text-amber/80 mb-3">今晚，想被怎样听见？</p><h2 class="text-[29px] font-light leading-tight mb-8">{{guide}}</h2><div class="compose glass rounded-[28px] p-5"><textarea v-model="content" maxlength="500" rows="8" :placeholder="placeholder" class="w-full resize-none bg-transparent text-[16px] leading-8 text-white/90 placeholder:text-white/30 focus:outline-none"></textarea><div class="flex justify-between text-[11px] text-white/35"><span>{{content.length}} / 500</span><span>写下来的，会被好好收下</span></div></div><div class="flex gap-2 mt-4 overflow-x-auto scroll"><button v-for="m in allTopics" @click="mood=mood===m?'':m" :class="['tag rounded-full px-3 py-2 text-xs whitespace-nowrap',mood===m?'active':'']">{{m}}</button><button @click="topicOpen=true" class="tag rounded-full px-3 py-2 text-xs whitespace-nowrap">＋ 新话题</button></div><div v-if="topicOpen" class="flex gap-2 mt-3"><input v-model="newTopic" @keyup.enter="addTopic" maxlength="8" placeholder="如：#被裁员的第一天" class="glass flex-1 rounded-full px-4 py-2.5 text-xs bg-transparent focus:outline-none"><button @click="addTopic" class="rounded-full px-4 text-xs bg-[#f5c77e] text-[#24182b]">创建</button></div><div class="glass rounded-2xl p-1.5 flex gap-1 mt-6"><button @click="visibility='private'" :class="['flex-1 rounded-xl py-3 text-xs',visibility==='private'?'bg-white/10 text-amber':'text-white/45']">◒ 藏进私密树洞</button><button @click="visibility='public'" :class="['flex-1 rounded-xl py-3 text-xs',visibility==='public'?'bg-white/10 text-amber':'text-white/45']">✦ 放飞公众广场</button></div><p class="text-[11px] text-white/30 text-center mt-3">{{visibility==='private'?'只有你能看到 · 本地隔离保存':'匿名公开 · 不展示个人标识'}}</p><button @click="submit" class="w-full mt-7 rounded-2xl py-4 bg-gradient-to-r from-[#d99c70] to-[#f5c77e] text-[#24182b] font-medium">投递给树洞 ↗</button><p class="text-center text-xs text-white/30 mt-10">树洞替你保管 365 天，然后随风散去</p></section>
<section v-else-if="tab==='private'" class="fade"><p class="text-sm text-amber/80 mb-3">Private Sanctuary</p><h2 class="text-[29px] font-light">你的私密区</h2><p class="text-sm text-white/40 mt-3 mb-8">这里的每一句话，都只属于你。</p><div v-if="!privateList.length" class="glass rounded-[28px] p-10 text-center"><div class="text-3xl mb-5">◌</div><p class="text-sm text-white/70">还没有藏进来的心事</p><button @click="go('listen')" class="mt-6 text-xs text-amber">写下第一句 ↗</button></div><div v-else class="space-y-4"><div v-for="e in privateList" :key="e.id" class="glass rounded-[24px] p-5"><div class="flex justify-between mb-4"><span class="text-[11px] text-amber/75">{{fmt(e.createdAt)}}</span><button @click="showDelete=e.id" class="text-white/30">···</button></div><p class="text-[15px] leading-7 text-white/80 whitespace-pre-wrap">{{e.content}}</p><div class="flex justify-between mt-5"><span class="text-xs text-white/35">{{e.mood}}</span><span class="text-[10px] text-white/25">私密保存 · 365 天</span></div></div></div></section>
<section v-else class="fade"><p class="text-sm text-amber/80 mb-3">Public Echoes</p><h2 class="text-[29px] font-light">公众区</h2><p class="text-sm text-white/40 mt-3 mb-6">陌生人的无声回响，只送抱抱，不留评论。</p><div class="flex gap-2 overflow-x-auto scroll mb-5"><button v-for="t in squareTopics" @click="filter=t" :class="['tag rounded-full px-3 py-2 text-xs whitespace-nowrap',filter===t?'active':'']">{{t==='全部'?'全部回响':t}}</button></div><div v-if="!publicList.length" class="glass rounded-[28px] p-10 text-center"><div class="text-3xl mb-5">✦</div><p class="text-sm text-white/70">{{filter==='全部'?'广场还很安静':'这个话题下还没有回响'}}</p></div><div v-else class="space-y-4"><div v-for="e in publicList" :key="e.id" class="glass rounded-[24px] p-5"><div class="text-[11px] text-white/35 mb-4">✦ 匿名树洞 · {{age(e.createdAt)}}</div><p class="text-[15px] leading-7 text-white/80 whitespace-pre-wrap">{{e.content}}</p><div class="flex justify-between items-center mt-5"><span class="text-xs text-amber/70">{{e.mood}}</span><button @click="hug(e.id)" :class="['rounded-full px-3.5 py-2 text-xs',hugs[e.id]?'bg-[#f5c77e]/20 text-amber':'bg-white/7 text-white/55']">{{hugs[e.id]?'♥ 已送达':'♡ 送一个抱抱'}} {{e.hugs||0}}</button></div></div></div><button v-if="publicList.length>=limit" @click="limit+=8" class="w-full py-5 text-xs text-white/35">继续向下 ↓</button></section>
<nav class="nav fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[480px] rounded-[22px] px-2 py-2 z-30"><div class="flex justify-around"><button v-for="i in [{id:'listen',icon:'◌',name:'倾听'},{id:'private',icon:'⌁',name:'私密区'},{id:'public',icon:'✦',name:'公众区'}]" @click="go(i.id)" :class="['relative flex-1 flex flex-col items-center gap-1 py-2 text-[11px]',tab===i.id?'active':'text-white/35']"><span class="text-lg">{{i.icon}}</span>{{i.name}}</button></div></nav></main>
<div v-if="sending" class="fixed inset-0 z-40 flex flex-col items-center justify-center modal"><div class="orb mb-8"></div><p class="text-sm text-amber/80 tracking-widest">树洞正在听…</p></div><div v-if="receipt" class="fixed inset-0 z-40 flex items-center justify-center px-5 modal"><div class="receipt glass rounded-[30px] p-7 w-full max-w-[390px] text-center"><div class="mx-auto mb-5 w-14 h-14 rounded-full bg-amber/15 text-amber flex items-center justify-center text-2xl">✦</div><p class="text-xs tracking-[.18em] text-amber/80 mb-4">TREE HOLLOW RECEIPT</p><h3 class="text-xl font-light leading-8">树洞收下了你的风，<br>风会带走你的烦恼。</h3><p class="mt-6 pt-5 border-t border-white/10 text-[15px] leading-7 text-white/70">{{receipt.quote}}</p><div v-if="receipt.crisis" class="mt-5 rounded-2xl bg-[#d99c70]/10 p-4 text-left text-xs leading-6 text-[#f2c9a7]">如果你正经历很难的时刻，可以拨打全国心理援助热线 <b>12356</b>，有人在电话那头陪你。</div><p class="text-[10px] text-white/30 mt-5">这段心事会被好好保管 365 天</p><button @click="warmRead(receipt.quote)" class="w-full mt-5 rounded-xl py-3 text-xs bg-white/10 text-amber">♫ 听树洞读给你听</button><div class="flex gap-3 mt-6"><button @click="receipt=null" class="flex-1 rounded-xl py-3 text-xs bg-white/7 text-white/60">再写一条</button><button @click="receipt=null;go('public')" class="flex-1 rounded-xl py-3 text-xs bg-[#f5c77e] text-[#24182b]">去广场看看</button></div></div></div>
<div v-if="showDelete" class="fixed inset-0 z-50 flex items-center justify-center px-6 modal"><div class="glass rounded-3xl p-6 w-full max-w-[340px] text-center"><h3>彻底销毁这条记忆？</h3><p class="text-xs text-white/40 mt-3">删除后无法恢复，它会随风散去。</p><div class="flex gap-3 mt-6"><button @click="showDelete=null" class="flex-1 py-3 rounded-xl text-xs bg-white/7">先留着</button><button @click="remove(showDelete)" class="flex-1 py-3 rounded-xl text-xs bg-[#d99c70]/80 text-[#24182b]">确认删除</button></div></div></div>
<div v-if="settings" class="fixed inset-0 z-50 flex items-center justify-center px-6 modal"><div class="glass rounded-3xl p-6 w-full max-w-[340px]"><h3 class="text-center">设置</h3><div class="mt-5 rounded-2xl bg-white/5 p-4 text-center"><p class="text-[11px] text-white/40">你已经在树洞存放了</p><p class="text-2xl text-amber mt-1">{{stats.total}} <span class="text-xs text-white/40">件心事</span></p><p class="text-[11px] text-white/35 mt-2">私密 {{stats.private}} · 公开 {{stats.public}}</p></div><button @click="toggleAudio" class="w-full mt-4 py-3 rounded-xl text-xs bg-white/7">{{audio?'关闭氛围声':'开启氛围声'}}</button><button v-if="!clearAsk" @click="clearAsk=true" class="w-full mt-3 py-3 rounded-xl text-xs bg-white/7 text-white/45">清空所有心事…</button><div v-else class="flex gap-3 mt-3"><button @click="clearAsk=false" class="flex-1 py-3 rounded-xl text-xs bg-white/7">取消</button><button @click="clearAll" class="flex-1 py-3 rounded-xl text-xs bg-[#d99c70]/80 text-[#24182b]">确认清空</button></div><p class="text-[10px] text-white/25 text-center mt-5">数据保存在本设备 · 清除缓存后无法找回<br>树洞替你保管 365 天</p><button @click="settings=false;clearAsk=false" class="w-full mt-4 py-3 rounded-xl text-xs bg-[#f5c77e] text-[#24182b]">完成</button></div></div><div v-if="toast" class="toast fixed bottom-28 left-1/2 z-[60] glass rounded-full px-5 py-3 text-xs whitespace-nowrap">{{toast}}</div></div>`}).mount('#app');
</script></body></html>
